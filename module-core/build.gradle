plugins {
    id "chapchap.spring-module-conventions"
    id "java-test-fixtures"
}

dependencies {
    testFixturesImplementation platform(
            "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
    )
    testFixturesImplementation "org.springframework.boot:spring-boot-test"
    testFixturesImplementation "org.springframework.boot:spring-boot-testcontainers"
    testFixturesImplementation "org.testcontainers:postgresql"
    testFixturesImplementation "org.testcontainers:testcontainers"
    testFixturesRuntimeOnly "org.postgresql:postgresql"
}
