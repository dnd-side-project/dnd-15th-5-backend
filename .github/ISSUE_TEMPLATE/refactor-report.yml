name: ♻️ Refactor
description: 기능 변경 없이 백엔드 코드 구조와 품질을 개선하는 작업을 등록합니다.
title: "[♻️ Refactor] "
labels:
  - "♻️ Refactor"
body:
  - type: input
    id: parentKey
    attributes:
      label: "🎟️ 작업 종류 (Feature Type)"
      description: 작업 종류의 Jira Ticket Number를 기입해주세요
      value: KAN-4
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📌 설명"
      description: 개선할 API, 도메인, 서비스 또는 데이터 접근 코드와 리팩토링 목적을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "🛠️ 구현 목록"
      description: 구조 개선, 중복 제거, 책임 분리 등 진행할 작업을 체크리스트로 작성해주세요.
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true
