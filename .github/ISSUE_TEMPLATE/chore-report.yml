name: 🔧 Chore
description: 빌드, 의존성, 패키지 및 개발 환경 관련 작업을 등록합니다.
title: "[🔧 Chore] "
labels:
  - "🔧 Chore"
body:
  - type: input
    id: parentKey
    attributes:
      label: "🎟️ 작업 종류 (Feature Type)"
      description: 작업 종류의 Jira Ticket Number를 기입해주세요
      value: KAN-4
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📌 설명"
      description: 변경할 빌드 설정, 의존성 또는 개발 환경과 작업 목적을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "🛠️ 구현 목록 (TODO)"
      description: 설정 변경, 의존성 업데이트 등 진행할 작업을 체크리스트로 작성해주세요.
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "✅ 참고"
      description: 관련 공식 문서, 버전 정보 또는 Issue를 첨부해주세요.
