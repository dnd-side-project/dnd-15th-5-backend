name: 🚨 Bug
description: API, 비즈니스 로직, 데이터 처리 등 백엔드에서 발생한 버그를 제보합니다.
title: "[🚨 BUG] "
labels:
  - "🚨 Bug"
body:
  - type: input
    id: parentKey
    attributes:
      label: "🎟️ 작업 종류 (Feature Type)"
      description: 작업 종류의 Jira Ticket Number를 기입해주세요
      value: KAN-4
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "🚨 버그 설명"
      description: 발생한 문제와 영향을 받는 API 또는 기능을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "💥 재현 방법"
      description: "요청한 API, HTTP 메서드, 요청 값, 실행 환경 등 문제를 재현할 수 있는 순서를 작성해주세요."

  - type: textarea
    id: expectedBehavior
    attributes:
      label: "💡 기대한 동작"
      description: 정상적인 응답, 데이터 변경 또는 처리 결과를 작성해주세요.

  - type: textarea
    id: reference
    attributes:
      label: "📸 참고 자료 (선택)"
      description: 에러 로그, 스택 트레이스, 요청·응답 내용 등 문제 파악에 도움이 되는 자료를 첨부해주세요.
