name: ⚙️ Infra
description: 배포, 서버 환경, 네트워크 및 CI/CD 관련 작업을 등록합니다.
title: "[⚙️ Infra] "
labels:
  - "⚙️ Infra"
body:
  - type: input
    id: parentKey
    attributes:
      label: "🎟️ 작업 종류 (Feature Type)"
      description: 작업 종류의 Jira Ticket Number를 기입해주세요
      value: KAN-4
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📌 설명"
      description: 변경할 인프라 구성과 작업 목적, 영향을 받는 환경을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "🛠️ 구현 목록"
      description: 배포 설정, 서버 구성, CI/CD 파이프라인 등 진행할 작업을 체크리스트로 작성해주세요.
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true
