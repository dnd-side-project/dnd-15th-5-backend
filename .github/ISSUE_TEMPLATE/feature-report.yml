name: ✨ Feature
description: 새로운 API, 비즈니스 로직 등 백엔드 기능 개발 작업을 등록합니다.
title: "[✨ Feature] "
labels:
  - "✨ Feature"
body:
  - type: input
    id: parentKey
    attributes:
      label: "🎟️ 작업 종류 (Feature Type)"
      description: 작업 종류의 Jira Ticket Number를 기입해주세요
      value: KAN-4
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📌 설명"
      description: 구현할 API 또는 서버 기능과 필요한 이유를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "🛠️ 구현 목록 (TODO)"
      description: API, 도메인 로직, 데이터베이스, 테스트 등 구현할 작업을 체크리스트로 작성해주세요.
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "✅ 참고"
      description: API 명세, ERD, 정책 문서 또는 관련 Issue를 첨부해주세요.
