name: Close Jira issue
on:
  issues:
    types:
      - closed

jobs:
  close-issue:
    name: Close Jira issue
    runs-on: ubuntu-latest

    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      - name: Extract Jira issue key from GitHub issue title
        id: extract-key
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          JIRA_KEY=$(echo "$ISSUE_TITLE" | grep -oE '[A-Z]+-[0-9]+')
          echo "JIRA_KEY=$JIRA_KEY" >> $GITHUB_ENV

      - name: Convert latest GitHub issue body to Jira syntax
        if: env.JIRA_KEY != ''
        uses: peter-evans/jira2md@v3
        id: md2jira
        with:
          input-text: |
            ### Github Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira

      - name: Sync latest GitHub issue body to Jira
        if: env.JIRA_KEY != ''
        uses: actions/github-script@v9
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ env.JIRA_KEY }}
          JIRA_DESCRIPTION: ${{ steps.md2jira.outputs.output-text }}
        with:
          script: |
            const jiraBaseUrl = process.env.JIRA_BASE_URL.replace(/\/$/, '');
            const jiraKey = encodeURIComponent(process.env.JIRA_KEY);
            const credentials = Buffer.from(
              `${process.env.JIRA_USER_EMAIL}:${process.env.JIRA_API_TOKEN}`,
            ).toString('base64');

            const response = await fetch(
              `${jiraBaseUrl}/rest/api/2/issue/${jiraKey}`,
              {
                method: 'PUT',
                headers: {
                  Accept: 'application/json',
                  Authorization: `Basic ${credentials}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  fields: {
                    description: process.env.JIRA_DESCRIPTION,
                  },
                }),
              },
            );

            if (!response.ok) {
              const responseBody = await response.text();
              throw new Error(
                `Failed to update Jira issue: ${response.status} ${responseBody}`,
              );
            }

      - name: Close Jira issue
        if: env.JIRA_KEY != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ env.JIRA_KEY }}
          transition: 완료
