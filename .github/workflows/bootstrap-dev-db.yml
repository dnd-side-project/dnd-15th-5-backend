name: Bootstrap Dev Database

on:
  workflow_dispatch:

concurrency:
  group: chapchap-ec2-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  bootstrap:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Bootstrap Dev database via SSM
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
        run: |
          DB_HOST_B64=$(printf '%s' "$DB_HOST" | base64 -w0)
          DB_ADMIN_PASSWORD_B64=$(printf '%s' "$DB_ADMIN_PASSWORD" | base64 -w0)
          DEV_DB_PASSWORD_B64=$(printf '%s' "$DEV_DB_PASSWORD" | base64 -w0)

          BOOTSTRAP_SCRIPT="export DB_HOST=\$(printf '%s' '$DB_HOST_B64' | base64 -d)
          export DB_PORT=5432
          export DB_ADMIN_USERNAME=chapchap
          export DB_ADMIN_PASSWORD=\$(printf '%s' '$DB_ADMIN_PASSWORD_B64' | base64 -d)
          export DEV_DB_NAME=chapchap_dev
          export DEV_DB_USERNAME=chapchap_dev
          export DEV_DB_PASSWORD=\$(printf '%s' '$DEV_DB_PASSWORD_B64' | base64 -d)
          $(cat infra/deploy/bootstrap-dev-db.sh)"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n --arg s "$BOOTSTRAP_SCRIPT" '{commands: [$s]}')" \
            --query "Command.CommandId" --output text)

          STATUS="InProgress"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "=== stdout ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query StandardOutputContent --output text
          echo "=== stderr ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query StandardErrorContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Dev DB bootstrap 실패: $STATUS"
            exit 1
          fi
