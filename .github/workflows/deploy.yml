name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC로 AWS 자격증명 발급
  contents: read

env:
  AWS_REGION: ap-northeast-2
  APP_DIR: /app/chapchap

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew :app-server:bootJar -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_URI: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # EC2가 arm64(t4g.micro)라서 명시하지 않으면 러너 아키텍처(amd64)로 빌드되어
          # "exec format error"가 남. Dockerfile에 RUN이 없어 에뮬레이션 없이도 크로스 빌드 가능.
          docker build --platform linux/arm64 -t "$ECR_URI:$IMAGE_TAG" .
          docker push "$ECR_URI:$IMAGE_TAG"

      # docker-compose.prod.yml / Caddyfile / .env는 매 배포마다 최신으로 덮어씀.
      - name: Sync compose & Caddyfile & .env to EC2
        env:
          ECR_URI: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}
        run: |
          COMPOSE_B64=$(base64 -w0 infra/deploy/docker-compose.prod.yml)
          CADDYFILE_B64=$(base64 -w0 infra/deploy/Caddyfile)
  
          ENV_CONTENT="ECR_IMAGE=$ECR_URI
          SPRING_PROFILES_ACTIVE=prod
          CORS_ALLOWED_ORIGIN_PATTERNS=${{ vars.CORS_ALLOWED_ORIGIN_PATTERNS }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=5432
          DB_NAME=chapchap
          DB_USERNAME=chapchap
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}
          KAKAO_REDIRECT_URI=${{ vars.KAKAO_REDIRECT_URI }}
          OAUTH_WEB_REDIRECT_URI=${{ vars.OAUTH_WEB_REDIRECT_URI }}
          OAUTH_APP_REDIRECT_URI=${{ vars.OAUTH_APP_REDIRECT_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          TZ=Asia/Seoul"
          ENV_B64=$(echo "$ENV_CONTENT" | base64 -w0)

          SYNC_SCRIPT="set -euo pipefail
          mkdir -p \"$APP_DIR\"
          echo \"$COMPOSE_B64\" | base64 -d > \"$APP_DIR/docker-compose.prod.yml\"
          echo \"$CADDYFILE_B64\" | base64 -d > \"$APP_DIR/Caddyfile\"
          echo \"$ENV_B64\" | base64 -d > \"$APP_DIR/.env\"
          chmod 600 \"$APP_DIR/.env\""

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n --arg s "$SYNC_SCRIPT" '{commands: [$s]}')" \
            --query "Command.CommandId" --output text)

          # 종료 상태(Success/Failed/Cancelled/TimedOut)가 나올 때까지 직접 폴링 (최대 10분).
          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query StandardErrorContent --output text
            echo "설정 동기화 실패: $STATUS"
            exit 1
          fi

      # 새 이미지를 standby 컨테이너에 배포하고,
      - name: Deploy (blue/green switch) via SSM
        env:
          ECR_URI: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DEPLOY_SCRIPT="export ECR_IMAGE=\"$ECR_URI\"
          export TAG=\"$IMAGE_TAG\"
          $(cat infra/deploy/deploy.sh)"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n --arg s "$DEPLOY_SCRIPT" '{commands: [$s]}')" \
            --query "Command.CommandId" --output text)

          # deploy.sh는 헬스체크(최대 60초)+ECR pull 시간까지 걸릴 수 있어 100초 고정 waiter로는 부족함.
          # 종료 상태가 나올 때까지 직접 폴링 (최대 10분).
          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "=== stdout ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query StandardOutputContent --output text
          echo "=== stderr ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query StandardErrorContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패: $STATUS"
            exit 1
          fi
