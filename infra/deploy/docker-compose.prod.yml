# 시크릿은 같은 디렉터리의 .env에서 공급.
services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./upstream.caddy:/etc/caddy/upstream.caddy:ro
      - ./frontend:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-net
      - dev-proxy-net
    depends_on:
      - app-blue
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /chapchap/app-server
        awslogs-create-group: "true"
        awslogs-stream: caddy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app-blue:
    image: ${ECR_IMAGE}:${BLUE_TAG:-latest}
    container_name: app-blue
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod,monitoring
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /chapchap/app-server
        awslogs-create-group: "true"
        awslogs-stream: app-blue
    restart: unless-stopped

  app-green:
    image: ${ECR_IMAGE}:${GREEN_TAG:-latest}
    container_name: app-green
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod,monitoring
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /chapchap/app-server
        awslogs-create-group: "true"
        awslogs-stream: app-green
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.2
    container_name: alloy
    env_file: .env.monitoring
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - app-net
    mem_limit: 384m
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  app-net:
    name: chapchap_app-net
    driver: bridge
  dev-proxy-net:
    name: chapchap_dev-proxy-net
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  alloy-data:
