chapchap:
  consumption:
    receipt-ocr:
      clova:
        invoke-url: https://example.com/clova-ocr
        secret-key: test-clova-ocr-secret-key
        api-gateway-key: test-clova-ocr-api-gateway-key
  oauth:
    kakao:
      client-id: test-client-id
      client-secret: test-client-secret
      admin-key: test-kakao-admin-key
      redirect-uri: https://example.com/oauth/kakao
    google:
      client-id: test-google-client-id
      client-secret: test-google-client-secret
      redirect-uri: https://example.com/oauth/google
    client:
      web-redirect-uri: https://web.example.com/oauth/callback
      app-redirect-uri: chapchap://oauth/callback
  jwt:
    secret: test-jwt-secret-key-with-at-least-32-bytes
  place:
    google-places:
      api-key: test-google-places-api-key
    sgis:
      consumer-key: test-sgis-consumer-key
      consumer-secret: test-sgis-consumer-secret
