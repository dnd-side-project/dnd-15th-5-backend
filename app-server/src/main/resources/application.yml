spring:
  application:
    name: chapchap-app-server

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

chapchap:
  auth:
    refresh-cookie:
      secure: true
  cors:
    allowed-origin-patterns: []
  oauth:
    kakao:
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      connect-timeout: 3s
      read-timeout: 5s
  jwt:
    signup-expiration: 15m
    access-expiration: 30m
    refresh-expiration: 14d
