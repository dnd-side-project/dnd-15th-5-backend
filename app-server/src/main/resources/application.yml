spring:
  application:
    name: chapchap-app-server

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

chapchap:
  account:
    profile-image:
      bucket: chapchap-profile-images
      read-url-expiration: 2m
  aws:
    s3:
      region: ap-northeast-2
  auth:
    refresh-cookie:
      secure: true
  cors:
    allowed-origin-patterns: []

  oauth:
    kakao:
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      unlink-uri: https://kapi.kakao.com/v1/user/unlink
      connect-timeout: 3s
      read-timeout: 5s
    google:
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      revoke-uri: https://oauth2.googleapis.com/revoke
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      connect-timeout: 3s
      read-timeout: 5s
  jwt:
    signup-expiration: 15m
    access-expiration: 30m
    refresh-expiration: 14d
