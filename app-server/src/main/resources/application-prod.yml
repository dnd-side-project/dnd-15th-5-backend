spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

chapchap:
  consumption:
    receipt-ocr:
      clova:
        invoke-url: ${CLOVA_OCR_INVOKE_URL}
        secret-key: ${CLOVA_OCR_SECRET_KEY}
        api-gateway-key: ${CLOVA_OCR_API_GATEWAY_KEY}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      admin-key: ${KAKAO_ADMIN_KEY}
      redirect-uri: ${KAKAO_REDIRECT_URI}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    client:
      web-redirect-uri: ${OAUTH_WEB_REDIRECT_URI}
      app-redirect-uri: ${OAUTH_APP_REDIRECT_URI}
  jwt:
    secret: ${JWT_SECRET}
  place:
    google-places:
      api-key: ${GOOGLE_PLACES_API_KEY}
    sgis:
      consumer-key: ${SGIS_CONSUMER_KEY}
      consumer-secret: ${SGIS_CONSUMER_SECRET}
