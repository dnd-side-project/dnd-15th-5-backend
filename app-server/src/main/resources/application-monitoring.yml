# 운영 Blue/Green에서만 prod 프로필과 함께 활성화
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: prod
    distribution:
      slo:
        http.server.requests: 100ms,300ms,1s,3s,10s
