spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/chapchap
    username: chapchap
    password: chapchap

  flyway:
    locations: classpath:db/migration,classpath:db/dev-data

  data:
    redis:
      host: localhost
      port: 6379

chapchap:
  notification:
    fcm:
      project-id: dnd-15th-5team
      credentials-file-path: local-json-file
  consumption:
    receipt-ocr:
      clova:
        invoke-url: https://example.com/clova-ocr
        secret-key: local-clova-ocr-secret-key
        api-gateway-key: local-clova-ocr-api-gateway-key
  cors:
    allowed-origin-patterns:
      - "*"
  oauth:
    kakao:
      client-id: local-kakao-client-id
      client-secret: local-kakao-client-secret
      admin-key: local-kakao-admin-key
      redirect-uri: http://localhost:8080/oauth/kakao/callback
    google:
      client-id: local-google-client-id
      client-secret: local-google-client-secret
      redirect-uri: http://localhost:8080/oauth/google/callback
    client:
      web-redirect-uri: http://localhost:3000/oauth/callback
      app-redirect-uri: chapchap://oauth/callback
  jwt:
    secret: local-development-jwt-secret-key-32-bytes-minimum
  place:
    google-places:
      api-key: local-google-places-api-key
    sgis:
      consumer-key: local-sgis-consumer-key
      consumer-secret: local-sgis-consumer-secret
