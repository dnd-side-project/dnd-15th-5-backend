plugins {
    id "chapchap.spring-library-conventions"
}

dependencies {
    implementation project(":module-core")

    implementation project(":module-place")

    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation platform("software.amazon.awssdk:bom:${libs.versions.aws.sdk.get()}")
    implementation "software.amazon.awssdk:s3"

    testImplementation testFixtures(project(":module-core"))
}

// 도메인 통합 테스트에도 app-server의 최신 스키마를 적용한다.
tasks.named("processTestResources") {
    from(project(":app-server").file("src/main/resources/db/migration")) {
        into "db/migration"
    }
}
